# Railway config for the Dashboard (Next.js) service.
# In Railway: create a second service from the same repo and set Config File Path to: apps/web/railway.toml
# Root Directory: leave empty (repo root) so the monorepo and shared package are available.

[build]
builder = "RAILPACK"
# From repo root: install, build shared, then build web
buildCommand = "pnpm install --frozen-lockfile && pnpm --filter @afe/shared build && pnpm --filter @afe/web build"
# Only redeploy when web or shared code changes
watchPatterns = ["apps/web/**", "packages/shared/**"]

[deploy]
startCommand = "pnpm --filter @afe/web start"
# Next.js serves on PORT by default when set
# Set variable NEXT_PUBLIC_API_URL to your API's Railway URL (e.g. https://xxx.up.railway.app)
