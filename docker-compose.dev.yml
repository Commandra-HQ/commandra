# Dev overlay: API and Web run in dev mode with hot reload. Use:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# Requires Supabase running separately (see docs/supabase-local.md). API uses DATABASE_URL
# from .env; when running API in Docker, set DATABASE_URL to use host.docker.internal below.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: sh -c "pnpm --filter @afe/shared build && pnpm --filter @afe/api dev"
    ports:
      - "3001:3001"
      - "3002:3002"
    env_file:
      - .env
    environment:
      # When API runs in Docker and Supabase runs on host, use host.docker.internal.
      # Override with your Supabase POSTGRES_PASSWORD and POOLER_TENANT_ID from docker/supabase/.env.
      # DATABASE_URL: postgresql://postgres.POOLER_TENANT_ID:POSTGRES_PASSWORD@host.docker.internal:5432/postgres
      # So the API (in container) can reach the Inngest dev server (inngest container)
      INNGEST_BASE_URL: http://inngest:8288
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages/shared:/app/packages/shared
    restart: "no"

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: pnpm --filter @afe/web dev
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    volumes:
      - ./apps/web:/app/apps/web
      - ./packages/shared:/app/packages/shared
    depends_on:
      - api
    restart: "no"

  inngest:
    command: inngest dev -u http://api:3001/api/inngest
