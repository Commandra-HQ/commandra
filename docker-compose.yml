services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "3001:3001"
      - "3002:3002"
    env_file:
      - .env
    environment:
      # So the API (in container) can reach the Inngest dev server (inngest container)
      INNGEST_BASE_URL: http://inngest:8288
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg16
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: afe
      POSTGRES_PASSWORD: afe_dev
      POSTGRES_DB: afe
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U afe"]
      interval: 5s
      timeout: 5s
      retries: 5

  inngest:
    image: inngest/inngest:latest
    ports:
      - "8288:8288"
    command: inngest dev -u http://host.docker.internal:3001/api/inngest
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  pgdata:
