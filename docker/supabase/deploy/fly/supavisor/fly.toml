# fly.toml app configuration file generated for commandra-supavisor on 2026-03-18T14:43:34+05:30
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'commandra-supavisor'
primary_region = 'bom'

[build]
  dockerfile = '../../docker/Dockerfile.supavisor'

[env]
  CLUSTER_POSTGRES = 'true'
  DB_POOL_SIZE = '5'
  ERL_AFLAGS = '-proto_dist inet_tcp'
  POOLER_DEFAULT_POOL_SIZE = '20'
  POOLER_MAX_CLIENT_CONN = '100'
  POOLER_POOL_MODE = 'transaction'
  PORT = '4000'
  POSTGRES_DB = 'postgres'
  POSTGRES_HOST = 'commandra-db.internal'
  POSTGRES_PORT = '5432'
  REGION = 'local'

[[services]]
  protocol = 'tcp'
  internal_port = 5432
  ports = []

  [[services.tcp_checks]]
    interval = '15s'
    timeout = '2s'
    grace_period = '10s'

[[services]]
  protocol = 'tcp'
  internal_port = 6543
  ports = []

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
