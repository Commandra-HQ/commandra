# fly.toml app configuration file generated for commandra-db on 2026-03-18T13:04:31+05:30
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#
# DB app. Uses local Dockerfile (subdir for PGDATA so Fly volume lost+found is OK).
# Secrets: set in Fly UI (see deploy/SECRETS-FOR-UI.txt). HA: 1 machine + 1 volume (for 2 machines use replication).

app = 'commandra-db'
primary_region = 'bom'

[build]
  dockerfile = 'Dockerfile'

[env]
  PGDATABASE = 'postgres'
  PGPORT = '5432'
  POSTGRES_DB = 'postgres'
  POSTGRES_HOST = '/var/run/postgresql'
  POSTGRES_PORT = '5432'

[[mounts]]
  source = 'pgdata'
  destination = '/var/lib/postgresql/vol'

[[services]]
  protocol = 'tcp'
  internal_port = 5432
  ports = []

  [[services.tcp_checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '60s'

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 2048
