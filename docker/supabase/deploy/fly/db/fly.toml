# DB app. Uses shared Dockerfile so same image can be used on Railway etc.
# Before first deploy: fly volumes create pgdata --size 10 --region YOUR_REGION
# Secrets: run ../../set-secrets-from-env.sh db (or set from UI using docker/supabase/.env)

app = "commandra-db"

[build]
dockerfile = "../../docker/Dockerfile.db"

[env]
POSTGRES_HOST = "/var/run/postgresql"
PGPORT = "5432"
POSTGRES_PORT = "5432"
PGDATABASE = "postgres"
POSTGRES_DB = "postgres"

[mounts]
source = "pgdata"
destination = "/var/lib/postgresql/data"

[[services]]
internal_port = 5432
protocol = "tcp"

  [[services.tcp_checks]]
  interval = "15s"
  timeout = "2s"
  grace_period = "10s"
