# fly.toml app configuration file generated for commandra-studio on 2026-03-18T14:43:36+05:30
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'commandra-studio'
primary_region = 'bom'

[build]
  dockerfile = '../../docker/Dockerfile.studio'

[env]
  HOSTNAME = '::'
  LOGFLARE_URL = 'http://commandra-analytics.internal:4000'
  NEXT_ANALYTICS_BACKEND_PROVIDER = 'postgres'
  NEXT_PUBLIC_ENABLE_LOGS = 'true'
  POSTGRES_DB = 'postgres'
  POSTGRES_HOST = 'commandra-db.internal'
  POSTGRES_PORT = '5432'
  STUDIO_PG_META_URL = 'http://commandra-meta.internal:8080'
  SUPABASE_URL = 'http://commandra-kong.internal:8000'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
