# fly.toml app configuration file generated for commandra-meta on 2026-03-18T14:43:33+05:30
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'commandra-meta'
primary_region = 'bom'

[build]
  dockerfile = '../../docker/Dockerfile.meta'

[env]
  PG_META_DB_HOST = 'commandra-db.internal'
  PG_META_DB_NAME = 'postgres'
  PG_META_DB_PORT = '5432'
  PG_META_DB_USER = 'supabase_admin'
  PG_META_PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[services]]
  protocol = 'tcp'
  internal_port = 8080
  ports = []

  [[services.http_checks]]
    interval = '10s'
    timeout = '2s'
    grace_period = '5s'
    method = 'get'
    path = '/health'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
