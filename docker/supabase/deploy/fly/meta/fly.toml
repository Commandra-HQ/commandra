# postgres-meta for Studio. Uses shared Dockerfile. Depends on commandra-db.
# Secrets: run ../../set-secrets-from-env.sh meta

app = "commandra-meta"

[build]
dockerfile = "../../docker/Dockerfile.meta"

[env]
PG_META_PORT = "8080"
PG_META_DB_HOST = "commandra-db.internal"
PG_META_DB_PORT = "5432"
PG_META_DB_NAME = "postgres"
PG_META_DB_USER = "supabase_admin"

[[services]]
internal_port = 8080
protocol = "tcp"

  [[services.http_checks]]
  interval = "10s"
  timeout = "2s"
  grace_period = "5s"
  method = "get"
  path = "/health"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0