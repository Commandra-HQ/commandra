# fly.toml app configuration file generated for commandra-kong on 2026-03-18T14:43:37+05:30
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'commandra-kong'
primary_region = 'bom'

[build]
  dockerfile = 'Dockerfile'

[env]
  KONG_DATABASE = 'off'
  KONG_DECLARATIVE_CONFIG = '/usr/local/kong/kong.yml'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 2

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
