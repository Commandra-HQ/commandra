# postgres-meta for Studio.

[build]
builder = "DOCKERFILE"
dockerfilePath = "docker/supabase/deploy/docker/Dockerfile.meta"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 30

# postgres-meta; 192 MiB avoids edge OOM on 128 MiB. Still cheap vs app containers.
[deploy.limitOverride.containers]
memoryBytes = 201326592
