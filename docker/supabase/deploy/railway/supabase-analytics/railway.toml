# Logflare analytics.

[build]
builder = "DOCKERFILE"
dockerfilePath = "docker/supabase/deploy/docker/Dockerfile.analytics"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 300

# Logflare (BEAM) — 768 MiB for stable deploys; raise toward 1 GiB only if OOM persists.
[deploy.limitOverride.containers]
memoryBytes = 805306368
