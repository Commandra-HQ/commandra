# Logflare analytics.

[build]
builder = "DOCKERFILE"
dockerfilePath = "docker/supabase/deploy/docker/Dockerfile.analytics"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 300

# Logflare: cheap tier (~384 MiB). May OOM — stop this service in Railway to save ~$4/GB-mo or raise memory.
[deploy.limitOverride.containers]
memoryBytes = 402653184
