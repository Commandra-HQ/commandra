# Logflare analytics.

[build]
builder = "DOCKERFILE"
dockerfilePath = "docker/supabase/deploy/docker/Dockerfile.analytics"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 300

# Logflare — 512 MiB balance (384 OOM’d before for some workloads). Stop service to save cost if unused.
[deploy.limitOverride.containers]
memoryBytes = 536870912
