# Supabase Studio UI. Set PORT=3000 and HOSTNAME=0.0.0.0 on the service for Kong upstream.

[build]
builder = "DOCKERFILE"
dockerfilePath = "docker/supabase/deploy/docker/Dockerfile.studio"

[deploy]
healthcheckPath = "/project/default"
healthcheckTimeout = 120

# Studio (Next). 512 MiB minimum practical; 768 MiB+ if admin UI OOMs.
[deploy.limitOverride.containers]
memoryBytes = 536870912
