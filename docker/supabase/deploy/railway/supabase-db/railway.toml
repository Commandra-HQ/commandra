# Supabase Postgres (Supabase image). In Railway: New Service → GitHub → same repo as Commandra.
# Settings → Build → Config File Path: docker/supabase/deploy/railway/supabase-db/railway.toml
# Add a volume mounted at /var/lib/postgresql/data (or path required by image; see PROVISION.md).

[build]
builder = "DOCKERFILE"
dockerfilePath = "docker/supabase/deploy/docker/Dockerfile.db"

# Balanced: 768 MiB for Postgres + extensions (512 MiB was tight). Raise if OOM in logs.
[deploy.limitOverride.containers]
memoryBytes = 805306368
