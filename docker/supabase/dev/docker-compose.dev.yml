# Dev overlay for Supabase: adds Inbucket (mail), DB seed, and optional Studio port.
# Run from docker/supabase: docker compose -f docker-compose.yml -f ./dev/docker-compose.dev.yml up -d

services:
  studio:
    # Use same image as base; no custom build (apps/studio does not exist in this repo)
    ports:
      - "8082:3000"   # Direct Studio access at http://localhost:8082 (Kong still at 8000)

  mail:
    container_name: supabase-mail
    image: inbucket/inbucket:3.0.3
    ports:
      - '2500:2500' # SMTP
      - '9000:9000' # web interface
      - '1100:1100' # POP3
  auth:
    environment:
      - GOTRUE_SMTP_USER=
      - GOTRUE_SMTP_PASS=
  meta:
    ports:
      - 5555:8080
  db:
    restart: 'no'
    volumes:
      # Always use a fresh database when developing
      - /var/lib/postgresql/data
      # Seed data should be inserted last (alphabetical order)
      - ./dev/data.sql:/docker-entrypoint-initdb.d/seed.sql
  storage:
    volumes:
      - /var/lib/storage
